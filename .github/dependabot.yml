# 의존성 관리 방침
# - 보안 취약점이 생기면 GitHub "Dependabot security updates"(저장소 설정에서 켬)가 고친 버전으로 PR을 자동으로 연다.
# - 일반 버전 업데이트 PR(큰 버전 포함)은 열지 않는다(open-pull-requests-limit: 0). 업그레이드는 필요할 때 직접 한다.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 0
